<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="description" content="UniApply — xalqaro universitetlarga hujjat topshirish platformasi." />
    <title>UniApply — Kelajagingizga yo‘l</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div
      id="frege-chat"
      style="display: none; position: fixed; right: 24px; bottom: 60px; z-index: 40; width: min(380px, calc(100vw - 32px)); height: 520px; max-height: calc(100vh - 84px)"
    ></div>
    <script src="https://mcp.frege.uz/v1/embed.js"></script>
    <script type="module">
      const apiKey = import.meta.env.VITE_FREGE_API_KEY;
      const agentId = import.meta.env.VITE_FREGE_AGENT_ID;

      if (!apiKey || !agentId) {
        console.error("Frege chat sozlanmagan. .env faylida VITE_FREGE_API_KEY va VITE_FREGE_AGENT_ID ni kiriting.");
      } else if (!window.Frege) {
        console.error("Frege chat skripti yuklanmadi.");
      } else {
        window.Frege.setApiKey(apiKey);
        window.Frege.mount({
          el: "#frege-chat",
          project: "01a12ec1-1559-757c-ac99-7449a8da79f7",
          stage: "staging",
          agent: agentId,
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
